name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    name: Unit Tests & Evaluation Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt pytest pytest-cov

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Run Incident Evaluation Benchmark Suite
        run: |
          python -m evals.run --incidents evals/synthetic/
